name: independent-filebeat
services:
  gateway:
    build: .
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN}
      PRIVACY_KEY: ${PRIVACY_KEY:?Set PRIVACY_KEY}
      PRIVACY_KEY_ID: ${PRIVACY_KEY_ID:-k1}
      LOKI_URL: http://loki:3100
      SAMPLE_RATE: ${SAMPLE_RATE:-1}
      QUEUE_LIMIT: ${QUEUE_LIMIT:-10000}
    volumes: [spool:/data]
    ports: ['127.0.0.1:18088:8080']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
  loki:
    image: grafana/loki:3.5.0
    command: ['-config.file=/etc/loki/config.yml']
    volumes: ['./deploy/loki.yml:/etc/loki/config.yml:ro', 'loki:/loki']
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.3.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes: ['./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro', './deploy/alerts.yml:/etc/prometheus/alerts.yml:ro', 'prometheus:/prometheus']
    ports: ['127.0.0.1:19090:9090']
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ['./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro', 'alerts:/alertmanager']
    ports: ['127.0.0.1:19093:9093']
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports: ['127.0.0.1:13001:3000']
    volumes: ['./deploy/grafana/provisioning:/etc/grafana/provisioning:ro', './deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro', 'grafana:/var/lib/grafana']
volumes:
  spool:
  loki:
  prometheus:
  alerts:
  grafana:
